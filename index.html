<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Camufla la barra de direcciones con el color del fondo azul marino -->
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Oculta la marca de agua evitando enviar el origen del sitio -->
  <meta name="referrer" content="no-referrer">
  <title>Galería de Fotos y Videos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main id="galeria"></main>

  <div class="modal">
    <div class="modal-content">
      <!-- Para fotos -->
      <img src="" alt="" id="modal-img" style="display: none;" referrerpolicy="no-referrer" />
      
      <!-- Para videos -->
      <video id="modal-video" controls style="display: none;"></video>

      <div class="info-card">
        <h3 id="info-titulo"></h3>
        <p id="info-meta">
          <span id="info-ubicacion"></span>
          <span id="info-fecha"></span>
        </p>
        <p id="info-descripcion"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
