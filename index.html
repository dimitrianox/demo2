<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  
  <title>Galería de Fotos y Videos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="atlas.css">
</head>
<body>

  <main id="galeria"></main>

  <div class="modal">
    <!-- Lienzo de fondo Atlas Premium -->
    <div id="atlas-canvas"></div>

    <div class="modal-content">
      <img src="" alt="" id="modal-img" style="display: none;" referrerpolicy="no-referrer" />
      <video id="modal-video" controls style="display: none;"></video>

      <div class="info-card">
        <h3 id="info-titulo"></h3>
        <p id="info-meta">
          <span id="info-ubicacion"></span>
          <span id="info-fecha"></span>
        </p>
        <p id="info-descripcion"></p>
      </div>
    </div>
  </div>

  <script src="atlas-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
