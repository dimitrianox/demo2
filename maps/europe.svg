<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" class="atlas-svg">
  <style>
    .land { fill: #121824; stroke: #1e293b; stroke-width: 0.8; }
    .grid { stroke: #1e293b; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.4; }
  </style>
  <g class="grid-layer">
    <line x1="0" y1="150" x2="800" y2="150" class="grid" />
    <line x1="0" y1="300" x2="800" y2="300" class="grid" />
    <line x1="0" y1="450" x2="800" y2="450" class="grid" />
    <line x1="200" y1="0" x2="200" y2="600" class="grid" />
    <line x1="400" y1="0" x2="400" y2="600" class="grid" />
    <line x1="600" y1="0" x2="600" y2="600" class="grid" />
  </g>
  <g class="map-layer">
    <!-- Siluetas ambientales europeas simplificadas -->
    <path class="land" d="M150,220 L180,200 L210,210 L220,240 L190,260 L160,250 Z" /> <!-- Reino Unido / Irlanda -->
    <path class="land" d="M220,250 L320,240 L380,280 L350,380 L250,390 L210,310 Z" /> <!-- Europa Central -->
    <path class="land" d="M180,340 L240,330 L250,420 L190,430 Z" /> <!-- Península Ibérica -->
    <path class="land" d="M300,370 L340,360 L360,430 L320,440 Z" /> <!-- Italia -->
  </g>
  <g id="route-layer"></g>
  <g id="nodes-layer"></g>
</svg>
