<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" class="atlas-svg">
  <style>
    .land { fill: #121824; stroke: #1e293b; stroke-width: 0.8; }
    .grid { stroke: #1e293b; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.3; }
  </style>
  <g class="grid-layer">
    <line x1="0" y1="250" x2="1000" y2="250" class="grid" />
    <line x1="500" y1="0" x2="500" y2="500" class="grid" />
  </g>
  <g class="map-layer">
    <!-- Continentes simplificados -->
    <path class="land" d="M150,120 L320,100 L300,280 L180,260 Z" /> <!-- América del Norte -->
    <path class="land" d="M280,290 L360,300 L320,450 L260,380 Z" /> <!-- América del Sur -->
    <path class="land" d="M450,100 L680,90 L650,220 L480,200 Z" /> <!-- Europa / Asia Noroeste -->
    <path class="land" d="M470,210 L580,220 L560,380 L460,330 Z" /> <!-- África -->
  </g>
  <g id="route-layer"></g>
  <g id="nodes-layer"></g>
</svg>
